<!--
  Supabase Dashboard → Authentication → Email Templates → Confirm signup
  Subject: Confirm your CoasterTrak email
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style type="text/css">
      @font-face {
        font-family: "Bungee";
        font-style: normal;
        font-weight: 400;
        src: url("https://fonts.gstatic.com/s/bungee/v17/N0bU2SZBIuF2PU_ECg.ttf") format("truetype");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url("https://fonts.gstatic.com/s/geist/v5/gyBhhwUxId8gMGYQMKR3pzfaWI_RnOM4nQ.ttf") format("truetype");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url("https://fonts.gstatic.com/s/geist/v5/gyBhhwUxId8gMGYQMKR3pzfaWI_Re-Q4nQ.ttf") format("truetype");
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:#f1f5f9;">
    <style type="text/css">
      @font-face {
        font-family: "Bungee";
        font-style: normal;
        font-weight: 400;
        src: url("https://fonts.gstatic.com/s/bungee/v17/N0bU2SZBIuF2PU_ECg.ttf") format("truetype");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url("https://fonts.gstatic.com/s/geist/v5/gyBhhwUxId8gMGYQMKR3pzfaWI_RnOM4nQ.ttf") format("truetype");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url("https://fonts.gstatic.com/s/geist/v5/gyBhhwUxId8gMGYQMKR3pzfaWI_Re-Q4nQ.ttf") format("truetype");
      }
    </style>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="background-color:#020617;padding:28px 32px;">
                <p style="margin:0;font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:22px;line-height:1.2;letter-spacing:0.04em;color:#f59e0b;font-weight:400;">
                  CoasterTrak
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 12px;font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:26px;line-height:1.2;color:#0f172a;font-weight:400;">
                  Confirm your email
                </h1>
                <p style="margin:0 0 24px;font-family:'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#475569;">
                  Welcome to CoasterTrak. Confirm {{ .Email }} so you can log coaster credits, save a wishlist, and keep your tally across devices.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#f59e0b;color:#0f172a;text-decoration:none;font-family:'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:15px;line-height:1;padding:14px 22px;border-radius:10px;">
                  Confirm email
                </a>
                <p style="margin:24px 0 0;font-family:'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#64748b;">
                  If you didn&apos;t create this account, you can ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;font-family:'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#94a3b8;">
                coastertrak.com<br />
                hello@coastertrak.com
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
