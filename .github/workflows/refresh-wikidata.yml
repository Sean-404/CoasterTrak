name: Refresh Wikidata Enrichment

on:
  schedule:
    - cron: "0 3 1 * *" # 1st of every month at 03:00 UTC
  workflow_dispatch:

jobs:
  enrich-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ingest raw Wikidata bindings (CoasterTrak Data)
        run: npm run data:ingest-wikidata -- --page-size 200 --no-lite-fallback

      - name: Normalize processed snapshot
        run: npm run data:normalize-wikidata -- --latest

      - name: Publish processed snapshot for legacy upload path
        run: npm run data:publish-processed

      - name: Enrich from Wikipedia infoboxes
        run: npx tsx scripts/fetch-wikidata-coasters.ts --from-json --enrich --enrich-limit 1000

      - name: Analyze catalog (dedupe + ThemeParks snapshot verify)
        run: npm run data:analyze-catalog -- --in data/wikidata_coasters.json --fail-on-duplicates --max-parks 170

      - name: Validate catalog snapshot and write quality report
        run: npm run data:validate-wikidata -- --in data/wikidata_coasters.json --meta data/wikidata_coasters.meta.json --min-rows 800

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastertrak-data-snapshot
          retention-days: 14
          path: |
            data/wikidata_coasters.json
            data/wikidata_coasters.meta.json
            data/processed/wikidata/**/meta.json
            data/reports/wikidata/**/*
            data/reports/wikidata/**/catalog-analysis.json
            data/reports/wikidata/**/catalog-analysis.md

      - name: Upload catalog JSON to Supabase Storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/upload-wikidata-to-storage.ts

      - name: Upload enriched data to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/upload-wikidata-to-db.ts

      # Fill gaps Wikidata did not provide, using {{Infobox roller coaster}} wikitext via MediaWiki API.
      - name: Backfill missing stats from Wikipedia infoboxes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/wikipedia-infobox-backfill.ts --limit 1000 --delay-ms 250
