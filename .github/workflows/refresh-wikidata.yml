name: Refresh Wikidata Catalog

on:
  schedule:
    - cron: "0 3 1 * *" # 1st of every month at 03:00 UTC
  workflow_dispatch:

jobs:
  enrich-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ingest raw Wikidata bindings
        run: npm run data:ingest-wikidata -- --page-size 200 --no-lite-fallback

      - name: Normalize processed snapshot
        run: npm run data:normalize-wikidata -- --latest

      - name: Materialize working catalog snapshot
        run: npm run data:materialize-snapshot -- --latest

      - name: Enrich from Wikipedia infoboxes
        run: npm run data:enrich-wikipedia -- --enrich-limit 2500

      - name: Analyze catalog (dedupe + ThemeParks snapshot verify)
        run: npm run data:analyze-catalog -- --in data/wikidata_coasters.json --fail-on-duplicates --max-parks 170

      - name: Validate catalog snapshot and write quality report
        run: npm run data:validate-wikidata -- --in data/wikidata_coasters.json --meta data/wikidata_coasters.meta.json --min-rows 800

      - name: Gated publish to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run data:publish-catalog -- --in data/wikidata_coasters.json --meta data/wikidata_coasters.meta.json --fail-on-duplicates --min-rows 800 --apply

      - name: Relink coasters off placeholder parks (DB)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/relink-placeholder-parks.ts --snapshot data/wikidata_coasters.json --apply

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastertrak-data-snapshot
          retention-days: 14
          path: |
            data/wikidata_coasters.json
            data/wikidata_coasters.meta.json
            data/processed/wikidata/**/meta.json
            data/published/wikidata/**/*
            data/reports/wikidata/**/*

      # Catalog-wide gap fill after publish: stats, type, manufacturer from enwiki infoboxes.
      - name: Backfill missing fields from Wikipedia infoboxes (DB)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/wikipedia-infobox-backfill.ts --limit 2500 --delay-ms 200

      - name: Backfill missing images from Wikipedia summaries (DB)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/backfill-wikipedia-images.ts --limit 1500 --delay-ms 200

      - name: Backfill missing Wikipedia lead summaries (DB)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/backfill-wikipedia-summaries.ts --limit 5000 --delay-ms 200

      # Post-sync: live Supabase analyze (field completeness, duplicates, outliers),
      # optional AI review, publish report for /admin/data/catalog.
      # Requires Sean-404/coastertrak-data on GitHub + secrets below (AI skipped if key unset).
      - name: Checkout coastertrak-data
        uses: actions/checkout@v5
        with:
          repository: Sean-404/coastertrak-data
          path: coastertrak-data
          token: ${{ secrets.COASTERTRAK_DATA_TOKEN || github.token }}

      - name: Apply catalog auto-repairs (DB)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run data:auto-repair

      - name: Install coastertrak-data dependencies
        working-directory: coastertrak-data
        run: npm ci

      - name: Catalog quality (analyze, AI review, publish)
        env:
          COASTERTRAK_DATA_DIR: ${{ github.workspace }}/coastertrak-data
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_REVIEW_LIMIT: "20"
        # Wikipedia backfills already ran above in this workflow.
        run: npx tsx scripts/post-sync-catalog-quality.ts --skip-fill
